<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FastqCA 压缩管理平台</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body { margin: 0; background: #f5f7fa; font-family: Arial, sans-serif; }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    #ratio-chart, #perf-chart { width: 100%; height: 340px; }
    .card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 12px 0; }
  </style>
</head>
<body>
<div id="app" class="wrap">
  <el-card>
    <template #header><b>FastqCA 系统登录</b></template>
    <div class="toolbar">
      <el-input v-model="auth.username" placeholder="用户名" style="max-width: 180px"></el-input>
      <el-input v-model="auth.password" placeholder="密码" show-password style="max-width: 180px"></el-input>
      <el-button @click="registerUser">注册</el-button>
      <el-button type="primary" @click="loginUser">登录</el-button>
      <el-tag v-if="token" type="success">{{ me.username }} ({{ me.role }})</el-tag>
      <el-button v-if="token" @click="logout">退出</el-button>
    </div>
  </el-card>

  <el-tabs v-model="activeTab" style="margin-top: 16px;">
    <el-tab-pane label="压缩任务" name="tasks">
      <el-card>
        <div class="toolbar">
          <input type="file" @change="pickFile" accept=".fastq,.fq,.txt" />
          <el-select v-model="form.quality_mode" style="width: 130px">
            <el-option label="无损" value="lossless"></el-option>
            <el-option label="有损(Q4)" value="lossy"></el-option>
          </el-select>
          <el-input-number v-model="form.threads" :min="1" :max="64"></el-input-number>
          <el-button type="primary" :disabled="!selectedFile || !token || uploading" @click="uploadAndCreateTask">
            {{ uploading ? '上传中...' : '上传并开始压缩' }}
          </el-button>
        </div>

        <el-table :data="tasks" style="margin-top: 12px">
          <el-table-column prop="id" label="任务ID" width="80"></el-table-column>
          <el-table-column prop="quality_mode" label="模式" width="110"></el-table-column>
          <el-table-column prop="status" label="状态" width="110"></el-table-column>
          <el-table-column prop="threads" label="线程" width="80"></el-table-column>
          <el-table-column prop="progress" label="进度">
            <template #default="scope"><el-progress :percentage="scope.row.progress"></el-progress></template>
          </el-table-column>
          <el-table-column label="操作" width="280">
            <template #default="scope">
              <el-button size="small" @click="openAnalytics(scope.row.id)">查看分析</el-button>
              <el-button size="small" @click="downloadResult(scope.row.id)">下载压缩包</el-button>
              <el-button size="small" @click="downloadReport(scope.row.id)">下载报告</el-button>
            </template>
          </el-table-column>
        </el-table>
      </el-card>

      <el-card style="margin-top: 16px;">
        <template #header><b>压缩效果分析（仅 FastqCA）</b></template>
        <div id="ratio-chart"></div>
      </el-card>
    </el-tab-pane>

    <el-tab-pane label="压缩历史" name="history">
      <el-card>
        <template #header><b>历史记录与统计</b></template>
        <el-button @click="fetchHistory">刷新历史</el-button>
        <el-table :data="history" style="margin-top: 12px">
          <el-table-column prop="task_id" label="任务ID" width="80"></el-table-column>
          <el-table-column prop="filename" label="文件名"></el-table-column>
          <el-table-column prop="quality_mode" label="模式" width="100"></el-table-column>
          <el-table-column prop="compression_ratio" label="压缩率" width="120">
            <template #default="scope">{{ formatRatio(scope.row.compression_ratio) }}</template>
          </el-table-column>
          <el-table-column prop="compression_time_sec" label="耗时(s)" width="100"></el-table-column>
          <el-table-column prop="throughput_mb_s" label="吞吐(MB/s)" width="120"></el-table-column>
          <el-table-column prop="finished_at" label="完成时间" width="210"></el-table-column>
        </el-table>
      </el-card>
    </el-tab-pane>

    <el-tab-pane label="性能监测" name="performance">
      <el-card>
        <template #header><b>性能总览</b></template>
        <div class="toolbar">
          <el-button @click="refreshPerformance">刷新性能数据</el-button>
        </div>
        <div class="card-grid">
          <el-statistic title="总任务数" :value="perf.overview.task_total || 0"></el-statistic>
          <el-statistic title="成功率(%)" :value="(perf.overview.success_rate || 0).toFixed(2)"></el-statistic>
          <el-statistic title="平均压缩耗时(s)" :value="(perf.overview.avg_compression_time_sec || 0).toFixed(2)"></el-statistic>
          <el-statistic title="平均压缩率" :value="formatRatio(perf.overview.avg_compression_ratio)"></el-statistic>
        </div>
        <div class="toolbar">
          <el-tag>CPU: {{ perf.system.cpu_percent || 0 }}%</el-tag>
          <el-tag>内存: {{ perf.system.memory_percent || 0 }}%</el-tag>
          <el-tag type="warning">运行中任务: {{ perf.system.active_tasks || 0 }}</el-tag>
          <el-tag>队列任务: {{ perf.system.queued_tasks || 0 }}</el-tag>
        </div>
        <div id="perf-chart"></div>
      </el-card>
    </el-tab-pane>

    <el-tab-pane label="用户管理" name="users">
      <el-card>
        <template #header><b>用户与权限管理（管理员）</b></template>
        <el-button :disabled="me.role !== 'admin'" @click="fetchUsers">刷新用户</el-button>
        <el-table :data="users" style="margin-top: 12px">
          <el-table-column prop="id" label="ID" width="80"></el-table-column>
          <el-table-column prop="username" label="用户名"></el-table-column>
          <el-table-column prop="role" label="角色" width="120"></el-table-column>
          <el-table-column prop="created_at" label="创建时间" width="220"></el-table-column>
          <el-table-column label="修改角色" width="220">
            <template #default="scope">
              <el-select :disabled="me.role !== 'admin'" v-model="scope.row.role" style="width: 120px">
                <el-option value="researcher" label="researcher"></el-option>
                <el-option value="admin" label="admin"></el-option>
              </el-select>
              <el-button size="small" :disabled="me.role !== 'admin'" @click="changeRole(scope.row)">保存</el-button>
            </template>
          </el-table-column>
        </el-table>
      </el-card>
    </el-tab-pane>
  </el-tabs>
</div>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      apiBase: 'http://127.0.0.1:5000',
      token: localStorage.getItem('token') || '',
      auth: { username: 'demo', password: '123456' },
      me: { username: '-', role: 'researcher' },
      activeTab: 'tasks',
      form: { quality_mode: 'lossless', threads: 4 },
      selectedFile: null,
      uploading: false,
      tasks: [],
      history: [],
      users: [],
      perf: { system: {}, overview: {} },
      ratioChart: null,
      perfChart: null,
      timer: null,
    };
  },
  mounted() {
    this.ratioChart = echarts.init(document.getElementById('ratio-chart'));
    this.perfChart = echarts.init(document.getElementById('perf-chart'));
    this.renderRatioChart(['Original', 'FastqCA'], [0, 0]);
    this.renderPerfChart([]);
    if (this.token) this.afterLogin();
  },
  beforeUnmount() {
    if (this.timer) clearInterval(this.timer);
  },
  methods: {
    headers() { return { Authorization: `Bearer ${this.token}` }; },
    toast(msg, type = 'success') { ElementPlus.ElMessage({ message: msg, type }); },
    formatRatio(v) { return v == null ? '-' : `${(v * 100).toFixed(2)}%`; },

    async registerUser() {
      try { await axios.post(`${this.apiBase}/api/auth/register`, this.auth); this.toast('注册成功'); }
      catch (e) { this.toast(e?.response?.data?.error || '注册失败', 'error'); }
    },
    async loginUser() {
      try {
        const { data } = await axios.post(`${this.apiBase}/api/auth/login`, this.auth);
        this.token = data.token;
        localStorage.setItem('token', this.token);
        this.toast('登录成功');
        await this.afterLogin();
      } catch (e) { this.toast(e?.response?.data?.error || '登录失败', 'error'); }
    },
    async afterLogin() {
      await this.fetchMe();
      await Promise.all([this.fetchTasks(), this.fetchHistory(), this.refreshPerformance()]);
      if (this.me.role === 'admin') await this.fetchUsers();
      this.startPolling();
    },
    logout() {
      this.token = '';
      localStorage.removeItem('token');
      this.tasks = []; this.history = []; this.users = []; this.perf = { system: {}, overview: {} };
    },
    async fetchMe() {
      const { data } = await axios.get(`${this.apiBase}/api/auth/me`, { headers: this.headers() });
      this.me = data;
    },
    pickFile(ev) { this.selectedFile = ev.target.files?.[0] || null; },

    async uploadAndCreateTask() {
      if (!this.selectedFile) return this.toast('请选择 FASTQ 文件', 'warning');
      this.uploading = true;
      const uploadId = `${Date.now()}_${Math.random().toString(16).slice(2)}`;
      const chunkSize = 4 * 1024 * 1024;
      const totalChunks = Math.ceil(this.selectedFile.size / chunkSize);
      try {
        for (let i = 0; i < totalChunks; i++) {
          const form = new FormData();
          form.append('upload_id', uploadId);
          form.append('chunk_index', i);
          form.append('chunk', this.selectedFile.slice(i * chunkSize, Math.min(this.selectedFile.size, (i + 1) * chunkSize)));
          await axios.post(`${this.apiBase}/api/files/chunk`, form, { headers: this.headers() });
        }
        const merged = await axios.post(`${this.apiBase}/api/files/merge`, {
          upload_id: uploadId, filename: this.selectedFile.name, total_chunks: totalChunks,
        }, { headers: this.headers() });
        await axios.post(`${this.apiBase}/api/tasks`, {
          file_id: merged.data.file_id, quality_mode: this.form.quality_mode, threads: this.form.threads,
        }, { headers: this.headers() });
        this.toast('任务创建成功');
        await this.fetchTasks();
      } catch (e) {
        this.toast(e?.response?.data?.error || '上传/建任务失败', 'error');
      } finally { this.uploading = false; }
    },

    async fetchTasks() {
      if (!this.token) return;
      const { data } = await axios.get(`${this.apiBase}/api/tasks`, { headers: this.headers() });
      this.tasks = data;
    },
    startPolling() {
      if (this.timer) clearInterval(this.timer);
      this.timer = setInterval(async () => {
        try {
          await this.fetchTasks();
          if (this.activeTab === 'performance') await this.refreshPerformance();
        } catch (_) {}
      }, 1500);
    },

    async fetchHistory() {
      if (!this.token) return;
      const { data } = await axios.get(`${this.apiBase}/api/history`, { headers: this.headers() });
      this.history = data;
    },

    async fetchUsers() {
      try {
        const { data } = await axios.get(`${this.apiBase}/api/users`, { headers: this.headers() });
        this.users = data;
      } catch (e) {
        this.toast(e?.response?.data?.error || '加载用户失败', 'warning');
      }
    },
    async changeRole(user) {
      try {
        await axios.put(`${this.apiBase}/api/users/${user.id}/role`, { role: user.role }, { headers: this.headers() });
        this.toast('角色更新成功');
      } catch (e) {
        this.toast(e?.response?.data?.error || '角色更新失败', 'error');
      }
    },

    renderRatioChart(labels, values) {
      this.ratioChart.setOption({ tooltip: {}, xAxis: { type: 'category', data: labels }, yAxis: { type: 'value' },
        series: [{ type: 'bar', data: values, name: '大小(Byte)' }] });
    },
    async openAnalytics(taskId) {
      try {
        const { data } = await axios.get(`${this.apiBase}/api/analytics/${taskId}`, { headers: this.headers() });
        this.renderRatioChart(data.bar.labels, data.bar.values);
      } catch (e) {
        this.toast(e?.response?.data?.error || '分析数据暂不可用', 'warning');
      }
    },

    renderPerfChart(series) {
      this.perfChart.setOption({
        tooltip: { trigger: 'axis' },
        legend: { data: ['CPU', 'Memory'] },
        xAxis: { type: 'category', data: series.map(s => s.time) },
        yAxis: { type: 'value' },
        series: [
          { name: 'CPU', type: 'line', data: series.map(s => s.cpu) },
          { name: 'Memory', type: 'line', data: series.map(s => s.mem) },
        ],
      });
    },
    async refreshPerformance() {
      if (!this.token) return;
      const system = await axios.get(`${this.apiBase}/api/performance/system`, { headers: this.headers() });
      const overview = await axios.get(`${this.apiBase}/api/performance/overview`, { headers: this.headers() });
      this.perf.system = system.data;
      this.perf.overview = overview.data;
      const series = (overview.data.system_recent || []).map(v => ({
        time: new Date(v.recorded_at).toLocaleTimeString(), cpu: v.cpu_percent, mem: v.memory_percent,
      }));
      this.renderPerfChart(series);
    },

    async downloadResult(taskId) {
      try {
        const resp = await axios.get(`${this.apiBase}/api/tasks/${taskId}/download`, {
          headers: this.headers(), responseType: 'blob',
        });
        const url = URL.createObjectURL(resp.data);
        const a = document.createElement('a'); a.href = url; a.download = `task_${taskId}.fqc`; a.click();
        URL.revokeObjectURL(url);
      } catch (e) { this.toast(e?.response?.data?.error || '下载失败', 'error'); }
    },
    async downloadReport(taskId) {
      try {
        const resp = await axios.get(`${this.apiBase}/api/reports/${taskId}`, {
          headers: this.headers(), responseType: 'blob',
        });
        const url = URL.createObjectURL(resp.data);
        const a = document.createElement('a'); a.href = url; a.download = `task_${taskId}_report.pdf`; a.click();
        URL.revokeObjectURL(url);
      } catch (e) { this.toast(e?.response?.data?.error || '下载失败', 'error'); }
    },
  },
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
